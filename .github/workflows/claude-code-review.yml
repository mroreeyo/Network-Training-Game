name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # 하위 에이전트를 단계마다 기다리며 돌리면(검토 4개 + 지적마다 검증) 한 번 훑을 때보다 오래 걸린다.
    # 시간이 넘으면 댓글을 하나도 못 남기고 잘리므로 여유를 둔다.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      # 리뷰 플러그인이 띄우는 하위 에이전트가 백그라운드로 가지 않게 한다.
      # 백그라운드로 가면 본 세션이 결과를 기다리지 않고 턴을 끝내서, 리뷰 없이 실행이 성공으로 끝난다.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # 명령 뒤의 영어 문장은 리뷰 명령에 함께 넘어가는 지시다.
          # 넣은 이유: 지시가 없으면 리뷰 모델이 "PR이 작다"며 하위 에이전트(4개 병렬 리뷰, 지적마다 검증)를
          # 건너뛰고 diff를 한 번 훑고 끝냈다 (PR #18 로그: subagent_stats spawned 0, 권한 거부 0건).
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            Follow every numbered step of the command exactly as written, whatever the size of the pull request.
            Launch each agent the steps describe with the Agent tool in the foreground (send the parallel agents of a step together in one message), and wait for their results before the next step.
            When you launch the agent that checks whether the pull request needs review, tell it that a small diff alone is not a reason to skip the review.
            Do not review the diff yourself in place of the 4 parallel review agents, and do not skip the validation agents that check each issue they found.
            Validate the CLAUDE.md issues from the compliance agents too (with sonnet agents), so that the filtering step does not drop them only because they were never validated.
          # 하위 에이전트가 PR을 읽는 gh 명령. 명령 파일의 allowed-tools가 하위 에이전트까지 가지 않을 때를 대비해 여기에도 적는다.
          # (checkout이 fetch-depth 1이라 git diff로는 PR 변경을 볼 수 없다.)
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'
